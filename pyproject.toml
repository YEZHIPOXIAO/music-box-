[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicbox"
version = "1.0.6"
description = "Multi-provider music player that binds your QQ Music / Kugou / Kuwo accounts (search, stream, lyrics, playlists)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MusicBox contributors" }]
keywords = ["music", "qqmusic", "kugou", "kuwo", "player", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "requests>=2.31",
    "pydantic>=2.5",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
musicbox = "musicbox.cli:main"

[tool.setuptools]
packages = ["musicbox", "musicbox.providers"]

[tool.setuptools.package-data]
musicbox = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits the real provider endpoints (network required)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
